services:
  redis:
    image: redis:alpine
    container_name: titanes_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  backend:
    build:
      context: ./backend
    container_name: titanes_backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
    volumes:
      # Mount duckdb so data persists even if backend container is deleted
      - ./backend/titanes.duckdb:/app/titanes.duckdb
    depends_on:
      - redis
    restart: always

  frontend:
    build:
      context: ./frontend
    container_name: titanes_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always

volumes:
  redis_data:
