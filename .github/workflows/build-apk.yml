name: Build Android APK (Kpital Mobile)

on:
  workflow_dispatch:
  push:
    paths:
      - 'kpital-mobile/**'
      - '.github/workflows/build-apk.yml'
    branches:
      - main

jobs:
  build:
    name: Build Native Go & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & NDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          # Localizar el NDK preinstalado en el runner de GitHub
          NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* 2>/dev/null | tail -n 1)
          if [ -z "$NDK_PATH" ]; then
            echo "Instalando NDK via sdkmanager..."
            $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
            NDK_PATH="$ANDROID_SDK_ROOT/ndk/26.1.10909125"
          fi
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Install gomobile & Build Go Android Library (.aar)
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
          mkdir -p kpital-mobile/android/app/libs
          cd kpital-mobile/go-core
          go mod tidy
          # Compilar el binario nativo AAR con gomobile
          gomobile bind -v -target=android -androidapi=26 -o ../android/app/libs/core.aar .
          ls -la ../android/app/libs/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        run: |
          cd kpital-mobile/android
          chmod +x gradlew || true
          # Ejecutar build del APK de lanzamiento/debug
          gradle assembleRelease --stacktrace || gradle assembleDebug --stacktrace

      - name: Find and Organize Generated APK
        run: |
          mkdir -p output-apk
          find kpital-mobile/android/app/build/outputs/apk/ -name "*.apk" -exec cp {} output-apk/kpital-mobile.apk \;
          ls -la output-apk/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kpital-mobile-apk
          path: output-apk/kpital-mobile.apk
          retention-days: 14

      - name: Create or Update GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v1.0.0
          name: "Kpital Mobile Engine v1.0.0"
          body: |
            ### 📱 Kpital Mobile (Android APK)
            - **Motor nativo en Go** para intercepción y parseo de notificaciones bancarias (Nu, Rappi, Bancolombia).
            - Funciona en segundo plano con `NotificationListenerService`.
            - Sincronización automática de movimientos hacia tu servidor Kpital.
            
            **Instalación:**
            Descarga el archivo `kpital-mobile.apk` adjunto directamente a tu teléfono Android e instálalo permitiendo la instalación desde esta fuente.
          files: output-apk/kpital-mobile.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
