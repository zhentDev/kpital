name: Build Android APK (Kpital Mobile)

on:
  workflow_dispatch:
  push:
    paths:
      - 'kpital-mobile/**'
      - '.github/workflows/build-apk.yml'
    branches:
      - main

jobs:
  build:
    name: Build Native Go & Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          ndk-version: '26.1.10909125'

      - name: Install gomobile & Build Go Android Library (.aar)
        run: |
          cd kpital-mobile/go-core
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          
          # Agregar herramientas NDK Clang y GOPATH bin al PATH
          export PATH="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin:$(go env GOPATH)/bin:$PATH"
          
          echo "Ejecutando gomobile init..."
          gomobile init
          
          mkdir -p ../android/app/libs
          OUTPUT_AAR="$(pwd)/../android/app/libs/core.aar"
          
          echo "Building core.aar with NDK at $ANDROID_NDK_HOME..."
          gomobile bind -v -target=android/arm64 -androidapi=26 -o "$OUTPUT_AAR" .
          ls -lh "$OUTPUT_AAR"
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        run: |
          cd kpital-mobile/android
          chmod +x gradlew || true
          # Ejecutar build del APK con info completa de errores
          gradle assembleRelease --info --stacktrace || gradle assembleDebug --info --stacktrace

      - name: Find and Organize Generated APK
        run: |
          mkdir -p output-apk
          find kpital-mobile/android/app/build/outputs/apk/ -name "*.apk" -exec cp {} output-apk/kpital-mobile.apk \;
          ls -la output-apk/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kpital-mobile-apk
          path: output-apk/kpital-mobile.apk
          retention-days: 14

      - name: Extract App Version
        id: get_version
        run: |
          VERSION_NAME=$(grep 'versionName =' kpital-mobile/android/app/build.gradle.kts | head -n1 | cut -d'"' -f2)
          echo "version=v$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Detected version: v$VERSION_NAME"

      - name: Create or Update GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: "Kpital Mobile ${{ steps.get_version.outputs.version }}"
          body: |
            ### 📱 Kpital Mobile (Android APK)
            - **Versión:** ${{ steps.get_version.outputs.version }}
            - **Motor nativo en Go** para intercepción y parseo de notificaciones bancarias (Nequi, Nu Colombia, Bancolombia, RappiPay, Daviplata, Falabella).
            - Diálogo flotante interactivo en pantalla (`WindowManager overlay`) para selección táctil de cajitas/bolsillos.
            - Firma digital unificada y permanente para actualizaciones sin desinstalar.
            - Compatible con repositorios de F-Droid / IzzyOnDroid.
            
            **Instalación:**
            Descarga el archivo `kpital-mobile.apk` en tu dispositivo Android e instálalo.
          files: output-apk/kpital-mobile.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
