[project]
name = "titanes-portfolio-backend"
version = "1.0.0"
description = "Custom ETF Portfolio Tracker — FastAPI + Polars backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "yfinance==0.2.61",
    "polars==0.20.31",
    "pyarrow>=14.0.0",
    "duckdb>=1.0.0",
    "pandas==2.2.2",
    "python-dateutil==2.9.0",
    "httpx==0.27.0",
    "redis>=8.1.0",
    "pypdf>=4.0.0",
    "psycopg2-binary>=2.9.9",
    "openpyxl>=3.1.2",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # Errores estándar de pycodestyle
    "F",     # Pyflakes (variables no usadas, imports rotos, etc.)
    "I",     # isort (orden automático de imports)
    "UP",    # pyupgrade (sintaxis moderna de Python)
    "B",     # flake8-bugbear (errores comunes y bugs lógicos)
    "SIM",   # flake8-simplify (simplificación de código)
    "TCH",   # flake8-type-checking (gestión limpia de imports de tipos)
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
